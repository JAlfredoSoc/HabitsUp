$kind: http-request
name: "CP-21 [409 Conflict]: POST /RegistroUsuario - Rechazar registro con correo duplicado"
url: "{{baseUrl}}/RegistroUsuario"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "nombre": "Usuario Duplicado",
      "correo": "{{correoPrueba}}",
      "contrasena": "{{passwordPrueba}}",
      "edad": "28",
      "telefono": "3009998877"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('CP-21 [Código de estado] Responde 409 Conflict al intentar registrar un correo ya existente', function () {
          pm.response.to.have.status(409);
      });

      pm.test('CP-21 [Content-Type] El encabezado Content-Type es application/json', function () {
          pm.expect(pm.response.headers.get('Content-Type')).to.include('application/json');
      });

      pm.test('CP-21 [Body] Informa que el correo ya está registrado', function () {
          const body = pm.response.json();
          pm.expect(body).to.have.property('message', 'El correo ya está registrado');
      });

      pm.test('CP-21 [Rendimiento] Tiempo de respuesta menor a 500 ms', function () {
          pm.expect(pm.response.responseTime).to.be.below(500);
      });
    language: text/javascript
order: 2000
