$kind: http-request
name: "CP-34 [404 Not Found]: GET /habito/:id - Rechazar consulta de habito inexistente o eliminado"
url: "{{baseUrl}}/habito/{{habitoId}}"
method: GET
scripts:
  - type: afterResponse
    code: |-
      pm.test('CP-34 [Código de estado] Responde 404 Not Found al consultar un hábito eliminado o inexistente', function () {
          pm.response.to.have.status(404);
      });

      pm.test('CP-34 [Content-Type] El encabezado Content-Type es application/json', function () {
          pm.expect(pm.response.headers.get('Content-Type')).to.include('application/json');
      });

      pm.test('CP-34 [Body] Retorna mensaje claro de Hábito no encontrado sin error 500', function () {
          const body = pm.response.json();
          pm.expect(body).to.have.property('message', 'Hábito no encontrado');
      });

      pm.test('CP-34 [Rendimiento] Tiempo de respuesta menor a 500 ms', function () {
          pm.expect(pm.response.responseTime).to.be.below(500);
      });
    language: text/javascript
order: 6000
