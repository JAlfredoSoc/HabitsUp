$kind: http-request
name: "CP-26 [403 Forbidden]: GET /usuario/:id - Impedir acceso al perfil de otro usuario"
url: "{{baseUrl}}/usuario/{{otroUsuarioId}}"
method: GET
scripts:
  - type: afterResponse
    code: |-
      pm.test('CP-26 [Código de estado] Responde 403 Forbidden al intentar consultar perfil de otro usuario', function () {
          pm.response.to.have.status(403);
      });

      pm.test('CP-26 [Content-Type] El encabezado Content-Type es application/json', function () {
          pm.expect(pm.response.headers.get('Content-Type')).to.include('application/json');
      });

      pm.test('CP-26 [Body] Informa acceso denegado por falta de permisos sobre el recurso', function () {
          const body = pm.response.json();
          pm.expect(body).to.have.property('message').that.includes('Acceso denegado');
      });

      pm.test('CP-26 [Rendimiento] Tiempo de respuesta menor a 500 ms', function () {
          pm.expect(pm.response.responseTime).to.be.below(500);
      });
    language: text/javascript
order: 5000
