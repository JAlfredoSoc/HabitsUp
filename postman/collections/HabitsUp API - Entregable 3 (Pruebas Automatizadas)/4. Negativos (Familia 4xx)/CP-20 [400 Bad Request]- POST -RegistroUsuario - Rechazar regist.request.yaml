$kind: http-request
name: "CP-20 [400 Bad Request]: POST /RegistroUsuario - Rechazar registro con datos invalidos"
url: "{{baseUrl}}/RegistroUsuario"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "nombre": "Usuario Incompleto",
      "contrasena": "123",
      "edad": "15",
      "telefono": "abc"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('CP-20 [Código de estado] Responde 400 Bad Request ante omisión de correo obligatorio', function () {
          pm.response.to.have.status(400);
      });

      pm.test('CP-20 [Content-Type] El encabezado Content-Type es application/json', function () {
          pm.expect(pm.response.headers.get('Content-Type')).to.include('application/json');
      });

      pm.test('CP-20 [Body] Detalla los errores de validación de entrada', function () {
          const body = pm.response.json();
          pm.expect(body).to.have.property('message').that.is.a('string');
          pm.expect(body).to.have.property('errores').that.is.an('array').and.is.not.empty;
      });

      pm.test('CP-20 [Rendimiento] Tiempo de respuesta menor a 500 ms', function () {
          pm.expect(pm.response.responseTime).to.be.below(500);
      });
    language: text/javascript
order: 1000
