$kind: http-request
name: "CP-25 [401 Unauthorized]: GET /usuario/:id - Rechazar consulta de perfil sin token"
url: "{{baseUrl}}/usuario/{{usuarioId}}"
method: GET
scripts:
  - type: beforeRequest
    code: |-
      // Remover el encabezado Authorization inyectado por la colección para probar acceso sin token
      pm.request.headers.remove('Authorization');
    language: text/javascript
  - type: afterResponse
    code: |-
      pm.test('CP-25 [Código de estado] Responde 401 Unauthorized cuando no se envía token JWT', function () {
          pm.response.to.have.status(401);
      });

      pm.test('CP-25 [Content-Type] El encabezado Content-Type es application/json', function () {
          pm.expect(pm.response.headers.get('Content-Type')).to.include('application/json');
      });

      pm.test('CP-25 [Body] Exige token de autenticación y no expone datos del usuario', function () {
          const body = pm.response.json();
          pm.expect(body).to.have.property('message').that.includes('Token de autenticación requerido');
          pm.expect(body).to.not.have.property('correo');
      });

      pm.test('CP-25 [Rendimiento] Tiempo de respuesta menor a 500 ms', function () {
          pm.expect(pm.response.responseTime).to.be.below(500);
      });
    language: text/javascript
order: 4000
