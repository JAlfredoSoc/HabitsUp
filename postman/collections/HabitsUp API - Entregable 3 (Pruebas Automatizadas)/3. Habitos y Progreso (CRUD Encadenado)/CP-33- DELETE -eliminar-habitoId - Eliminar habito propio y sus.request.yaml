$kind: http-request
name: "CP-33: DELETE /eliminar/:habitoId - Eliminar habito propio y sus dependencias"
url: "{{baseUrl}}/eliminar/{{habitoId}}"
method: DELETE
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "usuarioId": "{{usuarioId}}"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('CP-33 [Código de estado] Responde 200 OK al eliminar el hábito', function () {
          pm.response.to.have.status(200);
      });

      pm.test('CP-33 [Content-Type] El encabezado Content-Type es application/json', function () {
          pm.expect(pm.response.headers.get('Content-Type')).to.include('application/json');
      });

      pm.test('CP-33 [Body] Confirma la eliminación exitosa del hábito y su progreso', function () {
          const body = pm.response.json();
          pm.expect(body).to.have.property('success', true);
          pm.expect(body).to.have.property('message', 'Hábito eliminado correctamente');
      });

      pm.test('CP-33 [Rendimiento] Tiempo de respuesta en escritura menor a 1000 ms', function () {
          pm.expect(pm.response.responseTime).to.be.below(1000);
      });
    language: text/javascript
order: 8000
