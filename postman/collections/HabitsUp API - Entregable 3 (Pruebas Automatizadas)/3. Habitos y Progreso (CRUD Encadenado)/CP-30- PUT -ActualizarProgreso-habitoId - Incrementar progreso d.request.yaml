$kind: http-request
name: "CP-30: PUT /ActualizarProgreso/:habitoId - Incrementar progreso dentro del limite"
url: "{{baseUrl}}/ActualizarProgreso/{{habitoId}}"
method: PUT
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "usuarioId": "{{usuarioId}}"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('CP-30 [Código de estado] Responde 200 OK al incrementar el progreso del hábito', function () {
          pm.response.to.have.status(200);
      });

      pm.test('CP-30 [Content-Type] El encabezado Content-Type es application/json', function () {
          pm.expect(pm.response.headers.get('Content-Type')).to.include('application/json');
      });

      pm.test('CP-30 [Body] Incrementa el contador de progreso en 1 unidad', function () {
          const body = pm.response.json();
          pm.expect(body).to.have.property('message', 'Progreso actualizado');
          pm.expect(body.progreso).to.have.property('progreso', 1);
      });

      pm.test('CP-30 [Rendimiento] Tiempo de respuesta en escritura menor a 1000 ms', function () {
          pm.expect(pm.response.responseTime).to.be.below(1000);
      });
    language: text/javascript
order: 4000
