$kind: http-request
name: GET /historial/:usuario - Consultar historial de acciones del usuario
url: "{{baseUrl}}/historial/{{usuarioId}}"
method: GET
scripts:
  - type: afterResponse
    code: |-
      pm.test('Historial [Código de estado] Responde 200 OK al consultar historial del usuario', function () {
          pm.response.to.have.status(200);
      });

      pm.test('Historial [Content-Type] El encabezado Content-Type es application/json', function () {
          pm.expect(pm.response.headers.get('Content-Type')).to.include('application/json');
      });

      pm.test('Historial [Body] Registra los eventos CREADO, PROGRESO_ACTUALIZADO y EDITADO', function () {
          const body = pm.response.json();
          pm.expect(body).to.have.property('success', true);
          pm.expect(body.data).to.be.an('array').that.is.not.empty;
      });

      pm.test('Historial [Rendimiento] Tiempo de respuesta en consulta menor a 500 ms', function () {
          pm.expect(pm.response.responseTime).to.be.below(500);
      });
    language: text/javascript
order: 7000
