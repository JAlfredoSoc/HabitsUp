$kind: http-request
name: "CP-29: GET /ObtenerHabitos/:usuarioID - Listar todos los habitos del usuario"
url: "{{baseUrl}}/ObtenerHabitos/{{usuarioId}}"
method: GET
scripts:
  - type: afterResponse
    code: |-
      pm.test('CP-29 [Código de estado] Responde 200 OK al listar hábitos del usuario', function () {
          pm.response.to.have.status(200);
      });

      pm.test('CP-29 [Content-Type] El encabezado Content-Type es application/json', function () {
          pm.expect(pm.response.headers.get('Content-Type')).to.include('application/json');
      });

      pm.test('CP-29 [Body] Incluye el hábito recién creado en el listado del usuario', function () {
          const body = pm.response.json();
          const habitoId = pm.collectionVariables.get('habitoId');
          pm.expect(body).to.have.property('success', true);
          pm.expect(body.data).to.be.an('array').that.is.not.empty;
          const encontrado = body.data.find(h => h._id === habitoId);
          pm.expect(encontrado).to.not.be.undefined;
      });

      pm.test('CP-29 [Rendimiento] Tiempo de respuesta en consulta menor a 500 ms', function () {
          pm.expect(pm.response.responseTime).to.be.below(500);
      });
    language: text/javascript
order: 3000
