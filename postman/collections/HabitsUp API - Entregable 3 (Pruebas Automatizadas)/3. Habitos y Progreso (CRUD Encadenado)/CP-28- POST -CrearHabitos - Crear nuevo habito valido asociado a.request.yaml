$kind: http-request
name: "CP-28: POST /CrearHabitos - Crear nuevo habito valido asociado al usuario"
url: "{{baseUrl}}/CrearHabitos"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "nombre": "Leer 20 minutos al día",
      "descripcion": "Leer un libro técnico durante 20 minutos",
      "estado": "pendiente",
      "categoria": "{{categoriaId}}",
      "horario": "2026-11-23T08:00:00.000Z",
      "fechaInicio": "2026-11-23T00:00:00.000Z",
      "fechaFin": "2026-12-31T23:59:59.000Z",
      "periodo": "diario",
      "frecuencia": 1,
      "frecuenciaSemanal": 0,
      "diasSeleccionados": ["Lunes", "Martes", "Miércoles", "Jueves", "Viernes"],
      "usuarioId": "{{usuarioId}}",
      "notificacionActiva": false,
      "subHabitos": []
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('CP-28 [Código de estado] Responde 201 Created al crear un hábito nuevo', function () {
          pm.response.to.have.status(201);
      });

      pm.test('CP-28 [Content-Type] El encabezado Content-Type es application/json', function () {
          pm.expect(pm.response.headers.get('Content-Type')).to.include('application/json');
      });

      pm.test('CP-28 [Body] Retorna hábito y progreso inicial en 0 y guarda habitoId para encadenamiento', function () {
          const body = pm.response.json();
          pm.expect(body).to.have.property('habito');
          pm.expect(body).to.have.property('progreso');
          pm.expect(body.habito).to.have.property('_id');
          pm.expect(body.habito).to.have.property('nombre', 'Leer 20 minutos al día');
          pm.expect(body.progreso).to.have.property('progreso', 0);
          pm.expect(body.progreso).to.have.property('frecuencia', 1);
          pm.collectionVariables.set('habitoId', body.habito._id);
          pm.environment.set('habitoId', body.habito._id);
      });

      pm.test('CP-28 [Contrato JSON Schema #5] Valida contrato de creación de hábito y progreso', function () {
          const schemaHabito = {
              type: 'object',
              required: ['habito', 'progreso'],
              properties: {
                  message: { type: 'string' },
                  habito: {
                      type: 'object',
                      required: ['_id', 'nombre', 'descripcion', 'estado', 'horario', 'fechaInicio'],
                      properties: {
                          _id: { type: 'string' },
                          nombre: { type: 'string' },
                          descripcion: { type: 'string' },
                          estado: { type: 'string' },
                          horario: { type: 'string' },
                          fechaInicio: { type: 'string' }
                      }
                  },
                  progreso: {
                      type: 'object',
                      required: ['_id', 'habito', 'periodo', 'frecuencia', 'progreso'],
                      properties: {
                          _id: { type: 'string' },
                          habito: { type: 'string' },
                          periodo: { type: 'string' },
                          frecuencia: { type: 'number' },
                          progreso: { type: 'number' }
                      }
                  }
              }
          };
          pm.response.to.have.jsonSchema(schemaHabito);
      });

      pm.test('CP-28 [Rendimiento] Tiempo de respuesta en escritura menor a 1000 ms', function () {
          pm.expect(pm.response.responseTime).to.be.below(1000);
      });
    language: text/javascript
order: 1000
