$kind: http-request
name: GET /habito/:id - Consultar habito creado por ID encadenado
url: "{{baseUrl}}/habito/{{habitoId}}"
method: GET
scripts:
  - type: afterResponse
    code: |-
      pm.test('GET Hábito [Código de estado] Responde 200 OK al consultar el hábito creado por ID', function () {
          pm.response.to.have.status(200);
      });

      pm.test('GET Hábito [Content-Type] El encabezado Content-Type es application/json', function () {
          pm.expect(pm.response.headers.get('Content-Type')).to.include('application/json');
      });

      pm.test('GET Hábito [Body] Retorna los datos exactos del hábito encadenado', function () {
          const body = pm.response.json();
          pm.expect(body).to.have.property('success', true);
          pm.expect(body.data).to.have.property('_id', pm.collectionVariables.get('habitoId'));
          pm.expect(body.data).to.have.property('nombre', 'Leer 20 minutos al día');
      });

      pm.test('GET Hábito [Contrato JSON Schema #6] Valida contrato de detalle de hábito', function () {
          const schemaDetalleHabito = {
              type: 'object',
              required: ['success', 'data'],
              properties: {
                  success: { type: 'boolean' },
                  data: {
                      type: 'object',
                      required: ['_id', 'nombre', 'descripcion', 'estado'],
                      properties: {
                          _id: { type: 'string' },
                          nombre: { type: 'string' },
                          descripcion: { type: 'string' },
                          estado: { type: 'string' }
                      }
                  }
              }
          };
          pm.response.to.have.jsonSchema(schemaDetalleHabito);
      });

      pm.test('GET Hábito [Rendimiento] Tiempo de respuesta en consulta menor a 500 ms', function () {
          pm.expect(pm.response.responseTime).to.be.below(500);
      });
    language: text/javascript
order: 2000
