$kind: http-request
name: "CP-36: POST /CrearHabitos (DDT) - Creacion parametrizada con pm.iterationData.get()"
url: "{{baseUrl}}/CrearHabitos"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "nombre": "{{ddtNombre}}",
      "descripcion": "{{ddtDescripcion}}",
      "estado": "pendiente",
      "categoria": "{{categoriaId}}",
      "horario": "2026-11-23T07:30:00.000Z",
      "fechaInicio": "2026-11-23T00:00:00.000Z",
      "fechaFin": "2026-12-31T23:59:59.000Z",
      "periodo": "{{ddtPeriodo}}",
      "frecuencia": {{ddtFrecuencia}},
      "frecuenciaSemanal": {{ddtFrecuenciaSemanal}},
      "diasSeleccionados": ["Lunes", "Miércoles", "Viernes"],
      "usuarioId": "{{usuarioId}}",
      "notificacionActiva": false,
      "subHabitos": []
    }
scripts:
  - type: beforeRequest
    code: |-
      const nombreIter = pm.iterationData.get('nombreHabito') || 'Hábito DDT Por Defecto';
      const descIter = pm.iterationData.get('descripcionHabito') || 'Descripción DDT por defecto para prueba';
      const periodoIter = pm.iterationData.get('periodo') || 'diario';
      const frecIter = pm.iterationData.get('frecuencia') !== undefined ? pm.iterationData.get('frecuencia') : 2;
      const frecSemIter = pm.iterationData.get('frecuenciaSemanal') !== undefined ? pm.iterationData.get('frecuenciaSemanal') : 0;

      pm.collectionVariables.set('ddtNombre', nombreIter);
      pm.collectionVariables.set('ddtDescripcion', descIter);
      pm.collectionVariables.set('ddtPeriodo', periodoIter);
      pm.collectionVariables.set('ddtFrecuencia', frecIter);
      pm.collectionVariables.set('ddtFrecuenciaSemanal', frecSemIter);
    language: text/javascript
  - type: afterResponse
    code: |-
      const expectedStatus = pm.iterationData.get('expectedStatus') ? Number(pm.iterationData.get('expectedStatus')) : 201;
      const expectedPeriodo = pm.iterationData.get('expectedPeriodo') || pm.collectionVariables.get('ddtPeriodo');
      const expectedFrecuencia = pm.iterationData.get('expectedFrecuencia') !== undefined ? Number(pm.iterationData.get('expectedFrecuencia')) : Number(pm.collectionVariables.get('ddtFrecuencia'));
      const expectedMessage = pm.iterationData.get('expectedMessage') || 'Hábito creado exitosamente';
      const expectedNombre = pm.iterationData.get('nombreHabito') || pm.collectionVariables.get('ddtNombre');

      pm.test('CP-36 [Código de estado DDT] Coincide con expectedStatus de pm.iterationData.get() (' + expectedStatus + ')', function () {
          pm.response.to.have.status(expectedStatus);
      });

      pm.test('CP-36 [Content-Type DDT] El encabezado Content-Type es application/json', function () {
          pm.expect(pm.response.headers.get('Content-Type')).to.include('application/json');
      });

      pm.test('CP-36 [Body DDT] Verifica nombre, periodo y frecuencia esperados desde pm.iterationData.get()', function () {
          const body = pm.response.json();
          pm.expect(body).to.have.property('message', expectedMessage);
          pm.expect(body.habito).to.have.property('nombre', expectedNombre);
          pm.expect(body.progreso).to.have.property('periodo', expectedPeriodo);
          pm.expect(body.progreso).to.have.property('frecuencia', expectedFrecuencia);
      });

      pm.test('CP-36 [Rendimiento DDT] Tiempo de respuesta en escritura menor a 1000 ms', function () {
          pm.expect(pm.response.responseTime).to.be.below(1000);
      });
    language: text/javascript
order: 1000
