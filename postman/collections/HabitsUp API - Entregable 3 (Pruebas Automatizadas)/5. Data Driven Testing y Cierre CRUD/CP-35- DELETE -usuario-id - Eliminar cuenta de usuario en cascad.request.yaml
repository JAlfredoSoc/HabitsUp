$kind: http-request
name: "CP-35: DELETE /usuario/:id - Eliminar cuenta de usuario en cascada"
url: "{{baseUrl}}/usuario/{{usuarioId}}"
method: DELETE
scripts:
  - type: afterResponse
    code: |-
      pm.test('CP-35 [Código de estado] Responde 200 OK al eliminar cuenta de usuario en cascada', function () {
          pm.response.to.have.status(200);
      });

      pm.test('CP-35 [Content-Type] El encabezado Content-Type es application/json', function () {
          pm.expect(pm.response.headers.get('Content-Type')).to.include('application/json');
      });

      pm.test('CP-35 [Body] Confirma eliminación de usuario, hábitos y progresos asociados', function () {
          const body = pm.response.json();
          pm.expect(body).to.have.property('success', true);
          pm.expect(body).to.have.property('usuarioId', pm.collectionVariables.get('usuarioId'));
      });

      pm.test('CP-35 [Rendimiento] Tiempo de respuesta en escritura menor a 1000 ms', function () {
          pm.expect(pm.response.responseTime).to.be.below(1000);
      });
    language: text/javascript
order: 2000
