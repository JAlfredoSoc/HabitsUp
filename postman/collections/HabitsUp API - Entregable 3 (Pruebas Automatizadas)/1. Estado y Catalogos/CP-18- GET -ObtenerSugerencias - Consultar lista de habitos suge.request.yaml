$kind: http-request
name: "CP-18: GET /ObtenerSugerencias - Consultar lista de habitos sugeridos"
url: "{{baseUrl}}/ObtenerSugerencias"
method: GET
scripts:
  - type: afterResponse
    code: |-
      pm.test('CP-18 [Código de estado] Responde 200 OK al consultar sugerencias', function () {
          pm.response.to.have.status(200);
      });

      pm.test('CP-18 [Content-Type] El encabezado Content-Type es application/json', function () {
          pm.expect(pm.response.headers.get('Content-Type')).to.include('application/json');
      });

      pm.test('CP-18 [Body] Retorna listado de sugerencias con nombre y descripción', function () {
          const body = pm.response.json();
          pm.expect(body).to.be.an('array').that.is.not.empty;
          pm.expect(body[0]).to.have.property('nombre').that.is.a('string');
          pm.expect(body[0]).to.have.property('descripcion').that.is.a('string');
      });

      pm.test('CP-18 [Rendimiento] Tiempo de respuesta en consulta menor a 500 ms', function () {
          pm.expect(pm.response.responseTime).to.be.below(500);
      });
    language: text/javascript
order: 3000
