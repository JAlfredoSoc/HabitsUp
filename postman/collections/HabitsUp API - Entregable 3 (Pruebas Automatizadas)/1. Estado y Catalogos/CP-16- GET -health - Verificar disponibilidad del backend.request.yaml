$kind: http-request
name: "CP-16: GET /health - Verificar disponibilidad del backend"
url: "{{baseUrl}}/health"
method: GET
scripts:
  - type: afterResponse
    code: |-
      pm.test('CP-16 [Código de estado] Responde 200 OK en health check', function () {
          pm.response.to.have.status(200);
      });

      pm.test('CP-16 [Content-Type] El encabezado Content-Type es application/json', function () {
          pm.expect(pm.response.headers.get('Content-Type')).to.include('application/json');
      });

      pm.test('CP-16 [Body] Retorna estado ok y marca de tiempo ISO válida', function () {
          const body = pm.response.json();
          pm.expect(body).to.have.property('status', 'ok');
          pm.expect(body).to.have.property('timestamp').that.is.a('string');
      });

      pm.test('CP-16 [Rendimiento] Tiempo de respuesta en consulta menor a 500 ms', function () {
          pm.expect(pm.response.responseTime).to.be.below(500);
      });
    language: text/javascript
order: 1000
