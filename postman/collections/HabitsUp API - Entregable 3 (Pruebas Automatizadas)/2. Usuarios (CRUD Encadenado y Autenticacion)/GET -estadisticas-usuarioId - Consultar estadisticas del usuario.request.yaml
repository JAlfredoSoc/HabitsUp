$kind: http-request
name: GET /estadisticas/:usuarioId - Consultar estadisticas del usuario
url: "{{baseUrl}}/estadisticas/{{usuarioId}}"
method: GET
scripts:
  - type: afterResponse
    code: |-
      pm.test('Estadísticas [Código de estado] Responde 200 OK al consultar estadísticas', function () {
          pm.response.to.have.status(200);
      });

      pm.test('Estadísticas [Content-Type] El encabezado Content-Type es application/json', function () {
          pm.expect(pm.response.headers.get('Content-Type')).to.include('application/json');
      });

      pm.test('Estadísticas [Body] Contiene estructura de resumen, categorías y progreso', function () {
          const body = pm.response.json();
          pm.expect(body).to.have.property('success', true);
          pm.expect(body.data).to.have.property('resumen');
          pm.expect(body.data.resumen).to.have.property('totalHabitos');
      });

      pm.test('Estadísticas [Rendimiento] Tiempo de respuesta en consulta menor a 500 ms', function () {
          pm.expect(pm.response.responseTime).to.be.below(500);
      });
    language: text/javascript
order: 5000
