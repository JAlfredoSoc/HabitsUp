$kind: http-request
name: GET /totalHabitosActivos/:usuarioId - Consultar total de habitos activos
url: "{{baseUrl}}/totalHabitosActivos/{{usuarioId}}"
method: GET
scripts:
  - type: afterResponse
    code: |-
      pm.test('Total Activos [Código de estado] Responde 200 OK al consultar total de hábitos activos', function () {
          pm.response.to.have.status(200);
      });

      pm.test('Total Activos [Content-Type] El encabezado Content-Type es application/json', function () {
          pm.expect(pm.response.headers.get('Content-Type')).to.include('application/json');
      });

      pm.test('Total Activos [Body] Retorna propiedad numérica total', function () {
          const body = pm.response.json();
          pm.expect(body).to.have.property('total').that.is.a('number');
      });

      pm.test('Total Activos [Rendimiento] Tiempo de respuesta en consulta menor a 500 ms', function () {
          pm.expect(pm.response.responseTime).to.be.below(500);
      });
    language: text/javascript
order: 6000
