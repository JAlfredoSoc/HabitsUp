$kind: http-request
name: "CP-22: POST /IniciarSesion - Login exitoso y guardado de token JWT"
url: "{{baseUrl}}/IniciarSesion"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "correo": "{{correoPrueba}}",
      "contrasena": "{{passwordPrueba}}"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('CP-22 [Código de estado] Responde 200 OK al iniciar sesión con credenciales válidas', function () {
          pm.response.to.have.status(200);
      });

      pm.test('CP-22 [Content-Type] El encabezado Content-Type es application/json', function () {
          pm.expect(pm.response.headers.get('Content-Type')).to.include('application/json');
      });

      pm.test('CP-22 [Body] Retorna token JWT válido, datos de usuario sin contraseña y guarda authToken', function () {
          const body = pm.response.json();
          pm.expect(body).to.have.property('message', 'Login exitoso');
          pm.expect(body).to.have.property('token').that.is.a('string').and.is.not.empty;
          pm.expect(body.usuario).to.have.property('_id', pm.collectionVariables.get('usuarioId'));
          pm.expect(body.usuario).to.not.have.property('contrasena');
          pm.collectionVariables.set('authToken', body.token);
          pm.environment.set('authToken', body.token);
      });

      pm.test('CP-22 [Contrato JSON Schema #3] Valida contrato de autenticación y sesión', function () {
          const schemaLogin = {
              type: 'object',
              required: ['message', 'token', 'usuario'],
              properties: {
                  message: { type: 'string' },
                  token: { type: 'string' },
                  usuario: {
                      type: 'object',
                      required: ['_id', 'nombre', 'correo', 'edad', 'telefono'],
                      properties: {
                          _id: { type: 'string' },
                          nombre: { type: 'string' },
                          correo: { type: 'string' },
                          edad: { type: 'string' },
                          telefono: { type: 'string' }
                      }
                  }
              }
          };
          pm.response.to.have.jsonSchema(schemaLogin);
      });

      pm.test('CP-22 [Rendimiento] Tiempo de respuesta en escritura menor a 1000 ms', function () {
          pm.expect(pm.response.responseTime).to.be.below(1000);
      });
    language: text/javascript
order: 2000
