$kind: http-request
name: "CP-24: GET /usuario/:id - Consultar perfil propio autenticado"
url: "{{baseUrl}}/usuario/{{usuarioId}}"
method: GET
scripts:
  - type: afterResponse
    code: |-
      pm.test('CP-24 [Código de estado] Responde 200 OK al consultar perfil propio con token válido', function () {
          pm.response.to.have.status(200);
      });

      pm.test('CP-24 [Content-Type] El encabezado Content-Type es application/json', function () {
          pm.expect(pm.response.headers.get('Content-Type')).to.include('application/json');
      });

      pm.test('CP-24 [Body] Retorna perfil del usuario autenticado sin exponer contraseña', function () {
          const body = pm.response.json();
          pm.expect(body).to.have.property('_id', pm.collectionVariables.get('usuarioId'));
          pm.expect(body).to.have.property('correo', pm.collectionVariables.get('correoPrueba'));
          pm.expect(body).to.not.have.property('contrasena');
      });

      pm.test('CP-24 [Contrato JSON Schema #4] Valida contrato de perfil de usuario', function () {
          const schemaPerfil = {
              type: 'object',
              required: ['_id', 'nombre', 'correo', 'edad', 'telefono', 'habitos'],
              properties: {
                  _id: { type: 'string' },
                  nombre: { type: 'string' },
                  correo: { type: 'string' },
                  edad: { type: 'string' },
                  telefono: { type: 'string' },
                  habitos: { type: 'array' }
              }
          };
          pm.response.to.have.jsonSchema(schemaPerfil);
      });

      pm.test('CP-24 [Rendimiento] Tiempo de respuesta en consulta menor a 500 ms', function () {
          pm.expect(pm.response.responseTime).to.be.below(500);
      });
    language: text/javascript
order: 3000
